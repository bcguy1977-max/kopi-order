<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Market Watch</title>
  <style>
    :root {
      --primary:   #d4a84b;
      --bg:        #0d0d0d;
      --border:    #1f1f1f;
      --text:      #ececec;
      --text-sub:  #6e6e6e;
      --green:     #34c759;
      --red:       #ff3b30;
      --safe-top:  env(safe-area-inset-top, 0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 20px calc(40px + var(--safe-bot));
    }

    /* ── Header ── */
    header {
      padding-top: calc(28px + var(--safe-top));
      padding-bottom: 24px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 1.05rem; font-weight: 600;
      color: var(--text); letter-spacing: -0.2px;
    }

    .header-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

    .back-btn, .refresh-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 0;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
      transition: color 0.15s;
      text-decoration: none;
      font-family: inherit;
    }

    .back-btn:hover, .refresh-btn:hover { color: var(--text); }
    .refresh-btn.spinning .r-icon { display: inline-block; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Period pill ── */
    .period-bar {
      display: flex; gap: 4px; margin-bottom: 28px;
    }

    .period-pill {
      padding: 5px 12px; border-radius: 6px;
      font-size: 0.78rem; font-weight: 500;
      border: none;
      background: none;
      color: var(--text-sub);
      cursor: pointer; touch-action: manipulation;
      font-family: inherit;
      transition: color 0.15s, background 0.15s;
    }

    .period-pill.active {
      color: var(--text);
      background: rgba(255,255,255,0.05);
    }

    /* ── Section ── */
    .section { margin-bottom: 32px; }

    .section-title {
      font-size: 0.72rem; font-weight: 500;
      color: var(--text-sub); margin-bottom: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Stock row ── */
    .stock-card {
      padding: 14px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .section > div > .stock-card:last-child { border-bottom: none; }

    .stock-info { flex: 1; min-width: 0; }

    .stock-name {
      font-weight: 500; font-size: 0.92rem; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .stock-ticker {
      font-size: 0.72rem; color: var(--text-sub); margin-top: 2px;
    }

    .stock-price-block { text-align: right; flex-shrink: 0; }

    .stock-price {
      font-size: 0.95rem; font-weight: 500; color: var(--text); white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .stock-change {
      font-size: 0.78rem; font-weight: 500; margin-top: 3px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .stock-change.up   { color: var(--green); }
    .stock-change.down { color: var(--red);   }
    .stock-change.flat { color: var(--text-sub); }

    /* ── Loading skeleton ── */
    .skel {
      background: rgba(255,255,255,0.04);
      border-radius: 3px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1;   }
    }

    .skel-price { width: 70px; height: 13px; margin-left: auto; }
    .skel-change { width: 54px; height: 13px; margin-left: auto; margin-top: 6px; }

    /* ── Error banner ── */
    .error-banner {
      padding: 10px 0;
      font-size: 0.8rem;
      color: var(--red);
      margin-bottom: 16px;
    }

    /* ── Footer ── */
    .footer {
      font-size: 0.72rem; color: var(--text-sub);
      text-align: center; line-height: 1.6;
      margin-top: 24px;
    }

    .footer a { color: var(--text-sub); text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Market</h1>
    <div class="header-right">
      <a class="back-btn" href="./index.html">Back</a>
      <button class="refresh-btn" id="refresh-btn" aria-label="Refresh">
        <span class="r-icon">↻</span>
      </button>
    </div>
  </header>

  <div class="period-bar">
    <button class="period-pill active" data-days="10"  data-si="d">1W</button>
    <button class="period-pill"        data-days="35"  data-si="d">1M</button>
    <button class="period-pill"        data-days="95"  data-si="w">3M</button>
    <button class="period-pill"        data-days="370" data-si="w">1Y</button>
  </div>

  <div id="error-area"></div>

  <div class="section">
    <div class="section-title">SG ETFs</div>
    <div id="grid-sg-etf"></div>
  </div>

  <div class="section">
    <div class="section-title">SG Blue Chips</div>
    <div id="grid-sg-blue"></div>
  </div>

  <div class="section">
    <div class="section-title">US</div>
    <div id="grid-us"></div>
  </div>

  <div class="footer" id="footer">Loading data…</div>

</div>

<script>
const STOCKS = [
  { symbol: 'ES3.SI', stooq: 'es3.si', name: 'SPDR STI ETF',        group: 'sg-etf',  currency: 'SGD' },
  { symbol: 'G3B.SI', stooq: 'g3b.si', name: 'Nikko AM STI ETF',     group: 'sg-etf',  currency: 'SGD' },
  { symbol: 'D05.SI', stooq: 'd05.si', name: 'DBS Group',             group: 'sg-blue', currency: 'SGD' },
  { symbol: 'O39.SI', stooq: 'o39.si', name: 'OCBC Bank',             group: 'sg-blue', currency: 'SGD' },
  { symbol: 'U11.SI', stooq: 'u11.si', name: 'UOB',                   group: 'sg-blue', currency: 'SGD' },
  { symbol: 'VOO',    stooq: 'voo.us', name: 'Vanguard S&P 500 ETF',  group: 'us',      currency: 'USD' },
  { symbol: 'NVDA',   stooq: 'nvda.us',name: 'NVIDIA',                group: 'us',      currency: 'USD' },
  { symbol: 'AAPL',   stooq: 'aapl.us',name: 'Apple',                 group: 'us',      currency: 'USD' },
];

const GRIDS = { 'sg-etf': 'grid-sg-etf', 'sg-blue': 'grid-sg-blue', 'us': 'grid-us' };

let currentDays = 10;
let currentSI   = 'd';

/* ── Date helpers ── */
function dateStr(d) {
  return d.toISOString().slice(0, 10).replace(/-/g, '');
}

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d;
}

/* ── Format helpers ── */
function fmtPrice(p, currency) {
  return (currency === 'SGD' ? 'S$' : '$') + p.toFixed(2);
}

function fmtPct(pct) {
  return (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
}

function cardId(symbol) { return 'card-' + symbol.replace(/\./g, '-'); }

/* ── Render skeleton cards ── */
function renderSkeletons() {
  Object.values(GRIDS).forEach(id => document.getElementById(id).innerHTML = '');
  STOCKS.forEach(s => {
    const grid = document.getElementById(GRIDS[s.group]);
    const div = document.createElement('div');
    div.className = 'stock-card';
    div.id = cardId(s.symbol);
    div.innerHTML = `
      <div class="stock-info">
        <div class="stock-name">${s.name}</div>
        <div class="stock-ticker">${s.symbol}</div>
      </div>
      <div class="stock-price-block">
        <div class="skel skel-price"></div>
        <div class="skel skel-change"></div>
      </div>`;
    grid.appendChild(div);
  });
}

/* ── Update card with live data ── */
function fillCard(stock, data) {
  const card = document.getElementById(cardId(stock.symbol));
  if (!card) return;

  if (!data) {
    card.querySelector('.stock-price-block').innerHTML =
      `<div class="stock-price" style="color:var(--text-sub)">—</div>
       <div class="stock-change flat">no data</div>`;
    return;
  }

  const { current, start } = data;
  const pct = ((current - start) / start) * 100;
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';

  card.querySelector('.stock-price-block').innerHTML = `
    <div class="stock-price">${fmtPrice(current, stock.currency)}</div>
    <div class="stock-change ${cls}">${fmtPct(pct)}</div>`;
}

/* ── Parse Stooq CSV  (Date,Open,High,Low,Close,Volume) ── */
function parseStooqCSV(text) {
  const lines = text.trim().split('\n').filter(l => l && !l.toLowerCase().startsWith('no '));
  if (lines.length < 2) throw new Error('no rows');
  const closes = lines.slice(1)
    .map(l => parseFloat(l.split(',')[4]))
    .filter(p => !isNaN(p));
  if (!closes.length) throw new Error('no closes');
  return { current: closes[closes.length - 1], start: closes[0], closes };
}

/* ── Fetch from Stooq (direct, then proxy fallback) ── */
async function fetchStock(stooq, days, si) {
  const d2  = dateStr(new Date());
  const d1  = dateStr(daysAgo(days));
  const url = `https://stooq.com/q/d/l/?s=${stooq}&d1=${d1}&d2=${d2}&i=${si}`;

  // 1 — try direct (Stooq sets Access-Control-Allow-Origin: *)
  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(9000) });
    if (res.ok) {
      const txt = await res.text();
      return parseStooqCSV(txt);
    }
  } catch (_) {}

  // 2 — proxy fallback
  const enc = encodeURIComponent(url);
  for (const proxy of [
    `https://corsproxy.io/?${enc}`,
    `https://api.allorigins.win/raw?url=${enc}`,
  ]) {
    try {
      const res = await fetch(proxy, { signal: AbortSignal.timeout(10000) });
      if (!res.ok) continue;
      const txt = await res.text();
      return parseStooqCSV(txt);
    } catch (_) {}
  }

  throw new Error('all sources failed');
}

/* ── Load all ── */
async function loadAll() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  document.getElementById('error-area').innerHTML = '';
  renderSkeletons();

  const settled = await Promise.allSettled(
    STOCKS.map(s => fetchStock(s.stooq, currentDays, currentSI))
  );

  let fails = 0;
  settled.forEach((r, i) => {
    if (r.status === 'fulfilled') fillCard(STOCKS[i], r.value);
    else { fillCard(STOCKS[i], null); fails++; }
  });

  if (fails) {
    document.getElementById('error-area').innerHTML =
      `<div class="error-banner">${fails} ticker${fails > 1 ? 's' : ''} unavailable</div>`;
  }

  const now = new Date();
  document.getElementById('footer').innerHTML =
    `Updated ${now.toLocaleTimeString()} · <a href="https://stooq.com" target="_blank" rel="noopener">Stooq</a>`;

  btn.classList.remove('spinning');
}

/* ── Period pills ── */
document.querySelectorAll('.period-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.period-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentDays = parseInt(pill.dataset.days);
    currentSI   = pill.dataset.si;
    loadAll();
  });
});

document.getElementById('refresh-btn').addEventListener('click', loadAll);
setInterval(loadAll, 5 * 60 * 1000);
loadAll();
</script>
</body>
</html>
